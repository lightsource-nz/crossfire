# Builds and tests crossfire on every push and pull request.
#
# The mechanics are shared -- see light_framework_mk3/.github/workflows/. This file states only
# what is particular to crossfire.
#
# NOTE the host job needs pico-sdk, unlike font-crusher's: this project's host configuration is
# pico_hostmode, a HOST build of the Pico SDK rather than a plain Linux one, because
# crossfire_forward_test includes hardware/gpio.h and will not compile without it.
name: CI

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: host tests
    uses: lightsource-nz/light_framework_mk3/.github/workflows/project-test.yml@v1
    with:
      project: crossfire
      light_display: true
      light_ui: true
      light_usb: true
      font_crusher: true
      pico_sdk: true

  firmware:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rp2040 (Pico)
            preset: conf-crossfire-debug
            targets: crossfire_main
            tree: build
          - name: rp2350 (Pico 2)
            preset: conf-crossfire-pico2-debug
            targets: crossfire_main
            #   build-pico2, not build: conf-crossfire-pico2-debug overrides binaryDir so the
            # RP2350 tree coexists with the rp2040 one, and the upload glob follows `tree`
            tree: build-pico2
          #   the SPI-link rig. Its own leg because CROSSFIRE_ENABLE_SPI_LINK defaults OFF, so
          # every other configuration compiles crossfire_spi_link.c to nothing -- CI included,
          # which meant the file had no coverage at all on a fresh checkout
          #   tree is build, not build-link: this preset shares ${sourceDir}/build with the other
          # firmware presets rather than owning one, because a longer binaryDir overflows the
          # Windows command-line limit at configure time. See the preset's own description.
          - name: rp2040 (SPI link rig)
            preset: conf-crossfire-link-debug
            targets: crossfire_main
            tree: build
          #   hub mode, for the same reason the link rig has a leg: CROSSFIRE_ENABLE_USB_HUB
          # defaults OFF, so every other firmware configuration compiles crossfire_hub.c to
          # nothing. The host job covers the hub LOGIC against the mock backend -- this leg is
          # what proves it still compiles against the real TinyUSB host stack
          - name: rp2040 (USB hub)
            preset: conf-crossfire-hub-debug
            targets: crossfire_main
            tree: build
    uses: lightsource-nz/light_framework_mk3/.github/workflows/project-build.yml@v1
    with:
      project: crossfire
      preset: ${{ matrix.preset }}
      targets: ${{ matrix.targets }}
      tree: ${{ matrix.tree }}
      light_display: true
      light_ui: true
      light_usb: true
      font_crusher: true
      pico_sdk: true
