# Builds and tests crossfire on every push and pull request.
#
# The mechanics are shared -- see light_framework_mk3/.github/workflows/. This file states only
# what is particular to crossfire.
#
# NOTE the host job needs pico-sdk, unlike font-crusher's: this project's host configuration is
# pico_hostmode, a HOST build of the Pico SDK rather than a plain Linux one, because
# crossfire_forward_test includes hardware/gpio.h and will not compile without it.
name: CI

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: host tests
    uses: lightsource-nz/light_framework_mk3/.github/workflows/project-test.yml@main
    with:
      project: crossfire
      light_display: true
      light_usb: true
      font_crusher: true
      pico_sdk: true

  firmware:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rp2040 (Pico)
            preset: conf-crossfire-debug
            targets: crossfire_main
            tree: build
          - name: rp2350 (Pico 2)
            preset: conf-crossfire-pico2-debug
            targets: crossfire_main
            tree: build
          #   the SPI-link rig. Its own leg because CROSSFIRE_ENABLE_SPI_LINK defaults OFF, so
          # every other configuration compiles crossfire_spi_link.c to nothing -- CI included,
          # which meant the file had no coverage at all on a fresh checkout
          - name: rp2040 (SPI link rig)
            preset: conf-crossfire-link-debug
            targets: crossfire_main
            tree: build-link
    uses: lightsource-nz/light_framework_mk3/.github/workflows/project-build.yml@main
    with:
      project: crossfire
      preset: ${{ matrix.preset }}
      targets: ${{ matrix.targets }}
      tree: ${{ matrix.tree }}
      light_display: true
      light_usb: true
      font_crusher: true
      pico_sdk: true
