adapter speed 5000

#   CORE 0 ONLY by default, which is not rp2040.cfg's default (USE_CORE SMP -- both cores in an
# hwthread RTOS group). See the RP2350 sibling config for the full reasoning and measurements;
# it applies identically, since both chips run the same framework and the same core 1
# message-drain worker.
#
#   in short: examining core 1 stops it while it holds the stream's critical section, and core 0
# then blocks forever on its next log call. -defer-examine was tried first and had to be
# abandoned -- `program` resets every declared target, and a deferred core has no Debug AP to
# reset through, so flashing failed with "Unable to reset target".
#
#   TO INSPECT CORE 1 (note rp2040.cfg names them core0/core1, not cm0/cm1):
#
#     openocd -c "set USE_CORE SMP" -f openocd.cfg
#
#   expect the firmware to stall when you do; that is the reason for the default.
#
#   NOT hardware-verified on RP2040 -- there was no RP2040 board to hand. The RP2350 equivalent
# was verified in both directions (stalls before, clean boots after, and flashing works).
if { ![info exists USE_CORE] } {
        set USE_CORE 0
}
