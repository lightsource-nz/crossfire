# STM32H743 (mini_stm32h7) over an ST-Link.
#
# interface/stlink.cfg, not stlink-dap.cfg: the latter is deprecated in OpenOCD 0.12 and warns
# on every run. Likewise 'transport select swd' rather than the old 'dapdirect_swd' spelling.
# SWD is selected explicitly because the ST-Link also offers JTAG and this board breaks out
# SWD only.
source [find interface/stlink.cfg]
transport select swd

source [find target/stm32h7x.cfg]

# no SVD is referenced anywhere for this part -- ST ships STM32H743.svd in their CMSIS pack
# rather than with the toolchain, and none is vendored here. Peripheral register views in a
# debugger will be unavailable until one is added; everything else works without it.
